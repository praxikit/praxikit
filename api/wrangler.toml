# Praxikit: the website and the account app, served from one Worker on one address.
# Deploy from this folder with:  npx wrangler deploy      (it builds the site first; see [build])
# Secrets are NOT stored here. Set them with:        npx wrangler secret put GITHUB_CLIENT_SECRET
#                                                    npx wrangler secret put SESSION_SECRET
name = "praxikit-admin"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
# Only praxikit.com answers; the long workers.dev address is switched off.
workers_dev = false

# The main address and its www form (www is redirected to the main one by the Worker). Deploying attaches these and creates the DNS records.
routes = [
  { pattern = "praxikit.com", custom_domain = true },
  { pattern = "www.praxikit.com", custom_domain = true },
]

# The website: built into ../site/dist before every deploy and served as static files; the Worker answers the account and admin pages.
[build]
command = "node ../site/build.mjs"

[assets]
directory = "../site/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
BASE_URL = "https://praxikit.com"
SITE_URL = "https://praxikit.com/"
GITHUB_CLIENT_ID = "Ov23liNkhHqThp3GPNfh"
# These are the defaults for the Praxikit organisation.
ORG = "praxikit"
TEAM = "maintainers"
REPO = "praxikit/praxikit"

# The submissions and accounts database (created with `npx wrangler d1 create praxikit-admin`). The binding must be named DB.
[[d1_databases]]
binding = "DB"
database_name = "praxikit-admin"
database_id = "f6deecda-fef5-4370-913c-6973b4db84bd"

# Per-visitor limit on public reads and sign-in starts: 120 a minute from one address. (Signed-in actions have their own per-person limits.)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60
