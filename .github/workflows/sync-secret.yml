name: sync-secret
# Copies a repository secret into the Worker, so a secret value never has to be typed into a terminal or a workflow input.
#   1) gh secret set NTFY_TOPIC        (paste the value at the hidden prompt)
#   2) gh workflow run sync-secret.yml -f name=NTFY_TOPIC
on:
  workflow_dispatch:
    inputs:
      name:
        description: Which secret to copy into the Worker
        required: true
        type: choice
        options:
          - NTFY_TOPIC
permissions:
  contents: read
concurrency:
  group: sync-secret
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install the pinned deploy tool
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Copy the secret into the Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHICH: ${{ inputs.name }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          case "$WHICH" in
            NTFY_TOPIC) VALUE="$NTFY_TOPIC" ;;
            *) echo "::error::That secret is not offered here."; exit 1 ;;
          esac
          if [ -z "$VALUE" ]; then echo "::error::Set the repository secret $WHICH first (gh secret set $WHICH)."; exit 1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::The Cloudflare repository secrets are not set."; exit 1; fi
          printf '%s' "$VALUE" | npx wrangler secret put "$WHICH"
