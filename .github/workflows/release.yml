name: release
# Push a tag like keel-v0.2.0. The tag must match kits/keel/kit.json; the release notes come from the CHANGELOG.
on:
  push:
    tags: ["*-v[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate kits and write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-kits.mjs
          node scripts/release-notes.mjs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
