name: pages
# Builds the catalog from kits/*/kit.json and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["kits/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/test.mjs
      # Until the repository variable MIRROR_TO is set, this address serves the full site. Once it is set (to the new address,
      # for example https://praxikit.com), every page here redirects there; versions.json and the feed stay real for installed kits.
      - name: Build
        env:
          MIRROR_TO: ${{ vars.MIRROR_TO }}
        run: |
          if [ -n "$MIRROR_TO" ]; then
            node site/build.mjs --config site/config.worker.json --mirror "$MIRROR_TO"
          else
            node site/build.mjs
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
