name: migrate
# Applies one database migration to the live database (Cloudflare D1), using the repository secrets that the deploy workflow uses.
# Only migrations that are safe to run more than once are offered (every statement is IF NOT EXISTS). Run it from the Actions tab,
# or:  gh workflow run migrate.yml -f file=0010_events.sql
on:
  workflow_dispatch:
    inputs:
      file:
        description: Migration file in api/migrations
        required: true
        type: choice
        options:
          - 0006_accounts.sql
          - 0007_community.sql
          - 0008_profiles.sql
          - 0009_requests.sql
          - 0010_events.sql
permissions:
  contents: read
concurrency:
  group: migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install the pinned deploy tool
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Apply
        working-directory: api
        env:
          MIGRATION: ${{ inputs.file }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$MIGRATION" in
            0006_accounts.sql|0007_community.sql|0008_profiles.sql|0009_requests.sql|0010_events.sql) ;;
            *) echo "::error::That migration is not offered here."; exit 1 ;;
          esac
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first."
            exit 1
          fi
          npx wrangler d1 execute praxikit-admin --remote --file="migrations/$MIGRATION"
