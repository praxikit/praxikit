name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json schema/kit.schema.json kits/*/kit.json kits/*/plugin/.claude-plugin/plugin.json kits/*/plugin/hooks/hooks.json kits/*/plugin/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('ok', process.argv[1])" "$f"
          done
      - name: Kits are valid
        run: node scripts/check-kits.mjs
      - name: Version bumped when a kit's shipped files changed
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          BASE="${BASE_PR:-$BASE_PUSH}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit; skipping"; exit 0
          fi
          node scripts/check-kits.mjs --base "$BASE"
      - name: Catalog site builds and escapes hostile input
        run: node site/test.mjs
      - name: Keel drift, cost and session-start tests
        run: |
          node kits/keel/tests/drift.test.mjs
          node kits/keel/tests/cost.test.mjs
          node kits/keel/tests/status.test.mjs
          node kits/keel/tests/report.test.mjs
          node kits/keel/tests/efficiency.test.mjs
          node scripts/check-submission.test.mjs
          node scripts/listings.test.mjs
          node api/test.mjs
          node --no-warnings api/test-submit.mjs
          node --no-warnings api/test-approve.mjs
          node --no-warnings api/test-listings.mjs
          node --no-warnings api/test-accounts.mjs
          node --no-warnings api/test-site.mjs
          node --no-warnings api/test-community.mjs
          node --no-warnings api/test-contributors.mjs
          node --no-warnings api/test-requests.mjs
          node --no-warnings api/test-notify.mjs
          node --no-warnings api/test-hardening.mjs
          node site/a11y.test.mjs
          node site/behaviour.test.mjs
          node site/links.test.mjs
          node kits/pitch-panel/tests/skill.test.mjs
      - name: actionlint on workflows and the security template (pinned, checksum verified)
        env:
          V: 1.7.7
        run: |
          curl -sSfL -o al.tgz "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_linux_amd64.tar.gz"
          curl -sSfL -o al.sums "https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_checksums.txt"
          grep " actionlint_${V}_linux_amd64.tar.gz\$" al.sums | sed 's/ actionlint_.*/ al.tgz/' | sha256sum -c -
          tar -xzf al.tgz actionlint
          ./actionlint .github/workflows/*.yml kits/*/plugin/templates/ci/*.yml
      - name: Keel hook denies a model-less Agent call
        run: |
          H=kits/keel/plugin/scripts/require-model.mjs
          set +e
          echo '{"tool_name":"Agent","tool_input":{"prompt":"x"}}' | node $H
          [ $? -eq 2 ] || { echo "expected exit 2"; exit 1; }
          set -e
          echo '{"tool_name":"Agent","tool_input":{"prompt":"x","model":"sonnet"}}' | node $H
          echo '{"tool_name":"Agent","tool_input":{"prompt":"x","subagent_type":"keel:builder"}}' | node $H
          echo '{"tool_name":"Agent","tool_input":{"prompt":"x","subagent_type":"fork"}}' | node $H
          echo 'garbage' | node $H
      - name: Skills and agents have frontmatter
        run: |
          for f in kits/*/plugin/skills/*/SKILL.md kits/*/plugin/agents/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "no frontmatter: $f"; exit 1; }
            grep -q '^name:' "$f" || { echo "no name: $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "no description: $f"; exit 1; }
          done
