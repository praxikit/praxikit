name: listing-drift
# Once a day, compares each listing's reviewed commit with its repository's current default branch,
# so the catalogue can say whether a kit has newer commits (a quiet note) or needs a person to read it again (when they touch files that run code),
# and tells the owner, once, when a kit newly needs re-review. It also reads each repository's public facts (stars, licence, last push) for the cards and the health score. It only asks the GitHub API about public repositories;
# nothing is cloned or run. site/drift.json and site/metrics.json change (and the site redeploys) only when a status or a shown number changes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: listings
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check for changes since review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cp site/drift.json "$RUNNER_TEMP/drift-before.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/drift-before.json"
          node scripts/listings.mjs drift --file site/listings.json --out site/drift.json | tee -a "$GITHUB_STEP_SUMMARY"
          NEWS=$(node scripts/listings.mjs drift-news --file site/listings.json --before "$RUNNER_TEMP/drift-before.json" --after site/drift.json | paste -sd, -)
          if [ -n "$NEWS" ]; then
            echo "Newly needing re-review: $NEWS" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$NTFY_TOPIC" ]; then curl -s -m 10 -H "Title: Kits need re-review" -H "Tags: eyes" -d "Newly needing re-review: $NEWS. Read the new commits, then run Add listing with replace." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true; fi
          fi
          node scripts/listings.mjs metrics --file site/listings.json --out site/metrics.json | tee -a "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- site/drift.json site/metrics.json; then
            echo "No status changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/drift.json site/metrics.json
          git commit -m "listings: update review statuses and GitHub facts"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
          echo "Statuses updated. The site is redeploying." >> "$GITHUB_STEP_SUMMARY"
