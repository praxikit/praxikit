name: add-listing
# Owner only: add a kit to the catalogue directly, with no approval step.
# Running a workflow needs write access to the repository. The repository is still read and checked
# first, and the entry is pinned to the commit that was read.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Name shown in the catalogue
        required: true
        type: string
      url:
        description: Repository link, https://github.com/owner/repo
        required: true
        type: string
      kind:
        description: Type
        required: true
        type: choice
        options: [plugin, skill, mcp, template, adapter, agent, hook]
      source:
        description: "recommended = suggested by someone else. community = submitted by its author. (To show it as one of your picks, tick the pick box below instead.)"
        required: true
        type: choice
        options: [recommended, community]
      tags:
        description: Comma-separated tags to help people find it (for example planning, marketing)
        required: false
        default: ""
        type: string
      why:
        description: One honest sentence on what it is or why you list it
        required: true
        type: string
      pick:
        description: I use this kit (shown as a pick, with the note below)
        required: false
        type: boolean
        default: false
      note:
        description: One line on how you use it (needed for a pick)
        required: false
        type: string
        default: ""
      allow_failed:
        description: List it even if the automatic checks failed
        required: false
        type: boolean
        default: false
      replace:
        description: It is already listed; replace the entry with this new review
        required: false
        type: boolean
        default: false
permissions: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      status: ${{ steps.scan.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: scan
        env:
          IN_NAME: ${{ inputs.name }}
          IN_URL: ${{ inputs.url }}
          IN_KIND: ${{ inputs.kind }}
          IN_SOURCE: ${{ inputs.source }}
          IN_TAGS: ${{ inputs.tags }}
          IN_WHY: ${{ inputs.why }}
          IN_ALLOW_FAILED: ${{ inputs.allow_failed }}
          IN_PICK: ${{ inputs.pick }}
          IN_NOTE: ${{ inputs.note }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/listings.mjs scan --mode dispatch --out-dir "$RUNNER_TEMP/listing"
          echo "status=$(cat "$RUNNER_TEMP/listing/status.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: listing
          path: ${{ runner.temp }}/listing
          retention-days: 3

  publish:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: listings
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: listing
          path: ${{ runner.temp }}/listing
      - name: Publish, or show why not
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ needs.scan.outputs.status }}
          DIR: ${{ runner.temp }}/listing
          REPLACE: ${{ inputs.replace }}
        run: |
          cat "$DIR/comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "ok" ]; then
            echo "Not listed. The reason is in the job summary."
            exit 1
          fi
          if [ "$REPLACE" = "true" ]; then
            node scripts/listings.mjs publish --entry "$DIR/entry.json" --file site/listings.json --replace
          else
            node scripts/listings.mjs publish --entry "$DIR/entry.json" --file site/listings.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/listings.json
          git commit -m "listings: add entry (Add listing workflow)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
          if [ "$REPLACE" = "true" ]; then gh workflow run listing-drift.yml --ref main; fi
          echo "Listed. The site is redeploying." >> "$GITHUB_STEP_SUMMARY"
