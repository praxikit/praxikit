name: remove-listing
# Owner only: take a listing off the catalogue and record it in the public log (docs/removals.md).
# Running a workflow needs write access to the repository. Nothing from the removed repository is read.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Repository link of the listing, https://github.com/owner/repo
        required: true
        type: string
      reason:
        description: Why it is being removed
        required: true
        type: choice
        options: [malicious, secret, licence, misleading, unmaintained, owner-request, other]
      note:
        description: Short public note for the log (optional)
        required: false
        type: string
permissions: {}
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: listings
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IN_URL: ${{ inputs.url }}
          IN_REASON: ${{ inputs.reason }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          node scripts/listings.mjs remove --url "$IN_URL" --reason "$IN_REASON" --note "$IN_NOTE" --file site/listings.json --log docs/removals.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/listings.json docs/removals.md
          git commit -m "listings: remove an entry (remove-listing workflow)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
          echo "Removed and logged. The site is redeploying." >> "$GITHUB_STEP_SUMMARY"
