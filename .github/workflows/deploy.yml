name: deploy
# Builds the website and the account app and deploys them to Cloudflare, where praxikit.com is served.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The listing workflows start this one after they change site/listings.json, because a push made with the workflow token does not start other workflows.
on:
  push:
    branches: [main]
    paths: ["kits/**", "site/**", "api/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Test the site (no secrets are available to this step)
        run: node site/test.mjs
      - name: Install the pinned deploy tool
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Deploy
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this workflow again."
            exit 1
          fi
          npx wrangler deploy
