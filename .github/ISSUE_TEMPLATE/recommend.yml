name: Suggest someone else's kit
description: A kit made by someone else that you found or use.
title: "Suggest: "
labels: ["recommendation"]
body:
  - type: markdown
    attributes:
      value: |
        Suggested kits are made by other people. They are listed after the automatic checks and a read-through by a person. Listing is not an endorsement and not a promise that a kit is safe; a kit becomes one of the owner's picks only if the owner uses it. This issue is public.
  - type: input
    id: name
    attributes:
      label: Name of the kit
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: A public https:// link to the source.
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Who made it?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [Plugin, Skill, Agent, Hook, MCP config, Template, Adapter]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you recommend it?
      description: What you used it for and what it did well. One honest paragraph.
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: Anything to watch out for?
      description: Permissions it asks for, rough edges, things it did that surprised you.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I have used it myself.
          required: true
        - label: I am not paid or otherwise rewarded for recommending it, or I have said so above.
          required: true
